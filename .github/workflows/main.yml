name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Find project folder
        id: proj
        run: |
          FILE=$(find . -name pubspec.yaml -not -path '*/.*' | awk '{print length, $0}' | sort -n | head -n 1 | cut -d' ' -f2-)
          DIR=$(dirname "$FILE")
          echo "Project folder: $DIR"
          echo "dir=$DIR" >> $GITHUB_OUTPUT

      - name: Get packages
        working-directory: ${{ steps.proj.outputs.dir }}
        run: flutter pub get

      - name: Build APK (with retries)
        working-directory: ${{ steps.proj.outputs.dir }}
        run: |
          for attempt in 1 2 3; do
            if flutter build apk --release; then
              exit 0
            fi
            echo "Attempt $attempt failed, retrying..."
            sleep $((attempt * 45))
          done
          exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: mathra-pipes-apk
          path: ${{ steps.proj.outputs.dir }}/build/app/outputs/flutter-apk/app-release.apk
