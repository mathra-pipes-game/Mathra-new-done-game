name: Build APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get packages
        run: flutter pub get

      - name: Build APK (with retries)
        run: |
          for attempt in 1 2 3; do
            if flutter build apk --release; then
              exit 0
            fi
            echo "Attempt $attempt failed, retrying..."
            sleep $((attempt * 45))
          done
          exit 1

      - name: Rename APK
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk mathra-pipes.apk
          ls -lh mathra-pipes.apk
          sha256sum mathra-pipes.apk

      # APK එක zip නැතිව කෙලින්ම download කරන්න පුළුවන් Release එකක් හදනවා
      - name: Create GitHub Release with APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" mathra-pipes.apk \
            --title "Mathra Pipes build ${{ github.run_number }}" \
            --notes "Direct APK download (no zip). Commit: ${{ github.sha }}"

      # Backup විදිහට artifact එකත් තියාගන්නවා
      - uses: actions/upload-artifact@v4
        with:
          name: mathra-pipes-apk
          path: mathra-pipes.apk
